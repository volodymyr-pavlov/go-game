# On every pull request, push to main and vX.Y.Z tag: the checks of the web app, the engine's tests, the WebAssembly
# build, the Playwright test on the real board, and the production builds. A push to main then deploys the web app to
# Cloudflare as a static site. A vX.Y.Z tag creates the GitHub Release from the matching section of CHANGELOG.md.
# Secrets for the deploy: CLOUDFLARE_API_TOKEN (made from the "Edit Cloudflare Workers" template) and
# CLOUDFLARE_ACCOUNT_ID. Optional repository variable: VITE_GA4_ID turns on the analytics consent bar in the built site.
# Phase 1 ships the game alone. Do not set the VITE_FIREBASE_* variables: without them the build has no accounts, no
# leaderboard and no online play, and needs no game server. Phase 2 sets them and deploys apps/api (deploy.yml).
# Actions are pinned by commit; the tag in the comment is what the commit resolved to when it was last updated.
# To update: git ls-remote --tags https://github.com/<action> refs/tags/<tag>, then replace the commit and tag together.
name: CI

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v[0-9]+.[0-9]+.[0-9]+']

permissions: {}

env:
  NODE_VERSION: '24'
  DO_NOT_TRACK: '1' # Turborepo sends no usage data

jobs:
  check-web:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci --prefer-offline --ignore-scripts
      - run: npm run check

  test-engine:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: packages/engine/go.mod
          cache-dependency-path: packages/engine/go.sum
      - run: go -C packages/engine vet ./...
      - run: go -C packages/engine test ./...

  # The engine compiled to WebAssembly, with Go's JavaScript glue, for every app that plays the game. The artifact keeps
  # the paths under apps/, so the jobs that need it download it into apps/.
  build-engine:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: packages/engine/go.mod
          cache-dependency-path: packages/engine/go.sum
      - run: sh packages/engine/scripts/build.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: engine
          path: |
            apps/*/public/engine.wasm
            apps/*/public/wasm_exec.js
          retention-days: 1

  # The game on the real board. The tests with accounts and online play skip themselves: they need
  # `npm run test:e2e:firebase`. The browsers come from Playwright itself, at the version package.json pins.
  e2e:
    needs: [build-engine]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: engine
          path: apps
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci --prefer-offline --ignore-scripts
      - run: npx --workspace @go-game/web playwright install --with-deps chromium
      - run: npm run test:e2e -w @go-game/web
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-reports
          path: apps/web/.reports/
          include-hidden-files: true
          retention-days: 7

  build:
    needs: [check-web, test-engine, build-engine, e2e]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: engine
          path: apps
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci --prefer-offline --ignore-scripts
      - run: npm run build -w @go-game/web
        env:
          VITE_GA4_ID: ${{ vars.VITE_GA4_ID }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web-dist
          path: apps/web/.dist/
          include-hidden-files: true
          retention-days: 7

  # The Telegram Mini App and the YouTube Playable are built on every run, so they cannot fall behind the packages they
  # share. The Playable is uploaded to YouTube by hand: take the youtube-dist artifact and zip it.
  build-apps:
    needs: [check-web, test-engine, build-engine]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: engine
          path: apps
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci --prefer-offline --ignore-scripts
      - run: npm run build -w @go-game/tma -w @go-game/youtube
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tma-dist
          path: apps/tma/.dist/
          include-hidden-files: true
          retention-days: 7
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: youtube-dist
          path: apps/youtube/.dist/
          include-hidden-files: true
          retention-days: 7

  # main goes to Cloudflare as a static site: the built page in apps/web/.dist/. wrangler comes from package.json.
  deploy:
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    needs: [build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    environment:
      name: production
      url: https://go-game.volodymyr-pavlov.workers.dev
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: web-dist
          path: apps/web/.dist
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci --prefer-offline --ignore-scripts
      - run: npx wrangler deploy --config apps/web/wrangler.jsonc --message "${GITHUB_SHA::8}"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  # The release notes are read from CHANGELOG.md, which must have a "## [X.Y.Z] - YYYY-MM-DD" section for the tag.
  # A tag run has no deploy job (deploy runs on main only), so the release waits for build.
  release:
    if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}
    needs: [build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          awk -v v="$VERSION" '
            /^## \[/ { on = ($0 ~ "^## \\[" v "\\] - [0-9]{4}-[0-9]{2}-[0-9]{2}") ; next }
            on { print }
          ' CHANGELOG.md | sed '/./,$!d' > release_notes.md
          if [ ! -s release_notes.md ]; then
            echo "CHANGELOG.md has no \"## [$VERSION] - YYYY-MM-DD\" section for tag $TAG" >&2
            exit 1
          fi
          cat release_notes.md
          gh release create "$TAG" --title "$TAG" --notes-file release_notes.md
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
