# On every pull request and push to main: the checks of the web app, the engine's tests, the WebAssembly build, the
# Playwright test on the real board, and the production builds. A push to main then deploys the web app to Cloudflare
# as a static site, and semantic-release reads the commit messages since the last tag: a feat or fix commit writes
# CHANGELOG.md, commits it as chore(release): X.Y.Z, tags vX.Y.Z and creates the GitHub Release. That commit is pushed
# with the workflow's GITHUB_TOKEN, so it starts no run; the release job skips it in case one is started by hand.
# Secrets for the deploy: CLOUDFLARE_API_TOKEN (made from the "Edit Cloudflare Workers" template) and
# CLOUDFLARE_ACCOUNT_ID. Optional repository variable: VITE_GA4_ID turns on the analytics consent bar in the built site.
# Phase 1 ships the game alone. Do not set the VITE_FIREBASE_* variables: without them the build has no accounts, no
# leaderboard and no online play, and needs no game server. Phase 2 sets them and deploys apps/api (deploy.yml).
# Actions are pinned by commit; the tag in the comment is what the commit resolved to when it was last updated.
# To update: git ls-remote --tags https://github.com/<action> refs/tags/<tag>, then replace the commit and tag together.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions: {}

env:
  NODE_VERSION: '24'
  DO_NOT_TRACK: '1' # Turborepo sends no usage data

jobs:
  check-web:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci --prefer-offline --ignore-scripts
      - run: npm run check

  test-engine:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: packages/engine/go.mod
          cache-dependency-path: packages/engine/go.sum
      - run: go -C packages/engine vet ./...
      - run: go -C packages/engine test ./...

  # The engine compiled to WebAssembly, with Go's JavaScript glue, for every app that plays the game. The artifact keeps
  # the paths under apps/, so the jobs that need it download it into apps/.
  build-engine:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: packages/engine/go.mod
          cache-dependency-path: packages/engine/go.sum
      - run: sh packages/engine/scripts/build.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: engine
          path: |
            apps/*/public/engine.wasm
            apps/*/public/wasm_exec.js
            apps/web/public/engine.wasm.br
          retention-days: 1

  # The game on the real board. The tests with accounts and online play skip themselves: they need
  # `npm run test:e2e:firebase`. The browsers come from Playwright itself, at the version package.json pins.
  e2e:
    needs: [build-engine]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: engine
          path: apps
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci --prefer-offline --ignore-scripts
      - run: npx --workspace @go-game/web playwright install --with-deps chromium
      - run: npm run test:e2e -w @go-game/web
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-reports
          path: apps/web/.reports/
          include-hidden-files: true
          retention-days: 7

  build:
    needs: [check-web, test-engine, build-engine, e2e]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: engine
          path: apps
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci --prefer-offline --ignore-scripts
      - run: npm run build -w @go-game/web
        env:
          VITE_GA4_ID: ${{ vars.VITE_GA4_ID }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web-dist
          path: apps/web/.dist/
          include-hidden-files: true
          retention-days: 7

  # The Telegram Mini App and the YouTube Playable are built on every run, so they cannot fall behind the packages they
  # share. The Playable is uploaded to YouTube by hand: take the youtube-dist artifact and zip it.
  build-apps:
    needs: [check-web, test-engine, build-engine]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: engine
          path: apps
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci --prefer-offline --ignore-scripts
      - run: npm run build -w @go-game/tma -w @go-game/youtube
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tma-dist
          path: apps/tma/.dist/
          include-hidden-files: true
          retention-days: 7
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: youtube-dist
          path: apps/youtube/.dist/
          include-hidden-files: true
          retention-days: 7

  # main goes to Cloudflare as a static site: the built page in apps/web/.dist/. wrangler comes from package.json.
  deploy:
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    needs: [build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    environment:
      name: production
      url: https://go-game.volodymyr-pavlov.workers.dev
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: web-dist
          path: apps/web/.dist
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci --prefer-offline --ignore-scripts
      - run: npx wrangler deploy --config apps/web/wrangler.jsonc --message "${GITHUB_SHA::8}"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  release:
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && !startsWith(github.event.head_commit.message, 'chore(release):') }}
    needs: [deploy, build-apps]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: release/package-lock.json
      - run: npm ci --prefix release
      - run: npx --prefix release semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
